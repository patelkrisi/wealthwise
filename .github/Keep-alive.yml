name: Keep alive

# Pings the live site once a day so the free Supabase database never goes idle
# (free projects pause after 7 days without activity). Vercel's daily cron does
# the same; this is a second, independent safety net.
on:
  schedule:
    - cron: '17 3 * * *' # 08:47 IST every day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Add a repository variable named SITE_URL with your live address (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          for i in 1 2 3; do
            if curl -fsS --max-time 30 "$SITE_URL/api/health"; then exit 0; fi
            sleep 20
          done
          exit 1
